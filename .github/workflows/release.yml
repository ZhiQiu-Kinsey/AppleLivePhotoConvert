name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本标签 (如 v2.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 .NET 10 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 运行自动化测试套件
        run: dotnet test LivePhotoConvert.slnx -c Release --verbosity normal

      - name: 编译发布 Native AOT 原生程序包
        run: |
          dotnet publish src/LivePhotoConvert.Cli/LivePhotoConvert.Cli.csproj `
            /p:PublishProfile=win-x64-aot `
            -o dist/aot
          # 清除调试符号 pdb 文件
          Remove-Item -Path "dist/aot/*.pdb" -Force -ErrorAction SilentlyContinue

          # 提取版本号并打包为 ZIP 归档
          $tag = "${{ github.ref_name || inputs.tag_name }}"
          if (-not $tag) { $tag = "win-x64" }
          $zipName = "LivePhotoConvert-$tag-win-x64.zip"
          Compress-Archive -Path "dist/aot/*" -DestinationPath $zipName -Force
          echo "RELEASE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: 创建 GitHub Release 并上传 ZIP 压缩包
        uses: softprops/action-gh-release@v2
        with:
          name: LivePhotoConvert ${{ github.ref_name || inputs.tag_name }}
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.RELEASE_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
