name: Release

# 只由推送的版本 tag 触发；工作流不会创建 tag。发布失败时在 Actions 页面对该次运行"Re-run"，
# 不提供手动输入 tag 的入口：检出的永远是触发事件本身的 tag，CI 与缓存不会执行外部指定的代码。
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.*'

# 默认只读；写权限只授予最后的发布任务
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 校验版本号与更新日志
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: 检出 tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 校验 tag 与 Directory.Build.props 版本一致
        id: meta
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $props = [xml](Get-Content -LiteralPath Directory.Build.props -Raw)
          $version = @($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          $expected = $env:TAG -replace '^[vV]', ''
          if ($version -ne $expected) {
            Write-Host "::error file=Directory.Build.props::tag $env:TAG 与 <Version>$version</Version> 不一致（见 AGENTS.md 第 7 节）。"
            exit 1
          }
          "tag=$env:TAG" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "发布 $env:TAG（版本 $version）"

      - name: 检查更新日志中有对应段落
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: ./.github/scripts/get-changelog-section.ps1 -Version $env:VERSION -OutFile "$env:RUNNER_TEMP/release-notes.md"

  ci:
    name: 发布前检查
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      upload-aot: true
    permissions:
      contents: read

  publish:
    name: 打包并创建 GitHub Release
    needs: [ prepare, ci ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # 创建 Release 并上传附件
      id-token: write      # 来源证明：向 Sigstore 申请签名证书
      attestations: write  # 来源证明：写入仓库的 attestations
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: 检出发布脚本与更新日志
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      # 发布包就是 CI 中通过 AOT 检查（警告视为错误）的那份产物，不再重新编译
      - name: 下载 Native AOT 发布目录
        uses: actions/download-artifact@v8
        with:
          name: aot-win-x64
          path: dist/aot

      - name: 打包 ZIP 并生成 SHA256SUMS.txt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zip = "release/LivePhotoConvert-$env:TAG-win-x64.zip"
          Compress-Archive -Path dist/aot/* -DestinationPath $zip -CompressionLevel Optimal
          ./.github/scripts/write-sha256sums.ps1 -Directory release -Filter '*.zip' -OutFile release/SHA256SUMS.txt

      - name: 生成构建来源证明
        uses: actions/attest@v4
        with:
          subject-path: release/LivePhotoConvert-${{ env.TAG }}-win-x64.zip

      - name: 提取更新说明
        shell: pwsh
        run: ./.github/scripts/get-changelog-section.ps1 -Version $env:VERSION -OutFile release-notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: LivePhotoConvert ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/LivePhotoConvert-${{ env.TAG }}-win-x64.zip
            release/SHA256SUMS.txt
