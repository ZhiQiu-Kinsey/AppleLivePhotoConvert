name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本标签 (如 v2.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 .NET 10 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 运行自动化测试套件
        run: dotnet test LivePhotoConvert.slnx -c Release --verbosity normal

      - name: 编译发布 Native AOT 原生单文件 (直接输出单个 exe)
        run: |
          dotnet publish src/LivePhotoConvert.Cli/LivePhotoConvert.Cli.csproj `
            /p:PublishProfile=win-x64-aot `
            -o dist/aot
          # 提取纯独立单个 exe 文件用于 Release 发布
          Copy-Item "dist/aot/LivePhotoConvert.exe" "LivePhotoConvert.exe" -Force

      - name: 创建 GitHub Release 并直接上传 exe
        uses: softprops/action-gh-release@v2
        with:
          name: LivePhotoConvert ${{ github.ref_name || inputs.tag_name }}
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            LivePhotoConvert.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
