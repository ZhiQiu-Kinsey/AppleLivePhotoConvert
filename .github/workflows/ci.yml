name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 .NET 10 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 编译解决方案
        run: dotnet build LivePhotoConvert.slnx -c Release

      # 含 Avalonia Headless 界面冒烟测试：Skia 离屏渲染，不需要显示器
      - name: 运行全部测试
        run: dotnet test LivePhotoConvert.slnx -c Release --no-build --verbosity normal

      - name: 上传界面截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/LivePhotoConvert.Desktop.Tests/bin/Release/net10.0/screenshots/
          if-no-files-found: warn

  aot-publish:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 .NET 10 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Native AOT 发布（裁剪与 AOT 警告视为错误）
        run: dotnet publish src/LivePhotoConvert.Desktop/LivePhotoConvert.Desktop.csproj -r win-x64 -c Release -o dist/aot -p:TreatWarningsAsErrors=true
